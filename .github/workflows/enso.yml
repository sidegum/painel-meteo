name: Dados do El Niño

on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enso
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar NOAA CPC, IRI e temperatura do mar
        run: node scripts/atualizar-enso.mjs
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- dados/enso.json; then echo "Sem mudança."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/enso.json
          git commit -m "Atualiza dados do El Niño"
          git push
