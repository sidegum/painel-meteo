name: Dados do El Niño

on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enso
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar NOAA CPC, IRI e temperatura do mar
        run: node scripts/atualizar-enso.mjs
      - name: Publicar se mudou
        id: publicar
        run: |
          if git diff --quiet -- dados/enso.json; then echo "Sem mudança."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/enso.json
          git commit -m "Atualiza dados do El Niño"
          git push
          echo "mudou=true" >> "$GITHUB_OUTPUT"
      # O commit acima (GITHUB_TOKEN) não dispara outros workflows, então o site do Cloudflare Pages é publicado aqui.
      - name: Publicar no Cloudflare Pages
        if: steps.publicar.outputs.mudou == 'true' && github.ref == 'refs/heads/main'
        run: scripts/publicar-pages.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJETO: ${{ vars.PAGES_PROJETO }}
          PAGES_MENSAGEM: Dados do El Niño atualizados
