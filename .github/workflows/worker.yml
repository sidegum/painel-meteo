name: Publicar Worker

# Publica o Worker na Cloudflare sempre que o código dele muda na main, ou à mão.
# Precisa de dois segredos do repositório: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# Sem eles, o workflow só avisa e termina sem erro.
# O token do INMET (opcional) fica só na Cloudflare: painel do Worker > Settings > Variables and Secrets.
# Variáveis opcionais do repositório: PAINEL_DOMINIO (subdomínio do site no Cloudflare Pages) e PAGES_PROJETO.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir segredos
        id: seg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Nada foi publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.seg.outputs.ok == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.seg.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Rodar os testes
        if: steps.seg.outputs.ok == 'true'
        run: npm test

      - name: Preparar KV e subdomínio workers.dev
        if: steps.seg.outputs.ok == 'true'
        id: cf
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          # KV: reaproveita o namespace "painel-meteo-kv" ou cria na primeira vez.
          kv=$(curl -sf "${auth[@]}" "$api/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="painel-meteo-kv") | .id' | head -1)
          if [ -z "$kv" ]; then
            kv=$(curl -sf "${auth[@]}" -X POST "$api/storage/kv/namespaces" -d '{"title":"painel-meteo-kv"}' | jq -r '.result.id')
          fi
          [ -n "$kv" ] && [ "$kv" != "null" ] || { echo "::error::Não consegui criar o KV. Confira as permissões do token."; exit 1; }
          sed -i "s/COLE_AQUI_O_ID_DO_KV/$kv/" worker/wrangler.toml

          # Subdomínio workers.dev: usa o da conta ou registra um na primeira vez.
          sub=$(curl -sf "${auth[@]}" "$api/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$sub" ]; then
            sub="painel-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            curl -sf "${auth[@]}" -X PUT "$api/workers/subdomain" -d "{\"subdomain\":\"$sub\"}" > /dev/null
          fi
          echo "url=https://painel-meteo.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      # Origens aceitas pelo CORS: as do wrangler.toml (GitHub Pages) mais o site do Cloudflare Pages, montadas a partir
      # das variáveis do repositório PAINEL_DOMINIO (ex.: tempo.seudominio.com.br) e PAGES_PROJETO (padrão painel-meteo).
      - name: Publicar
        if: steps.seg.outputs.ok == 'true'
        working-directory: worker
        env:
          PAINEL_DOMINIO: ${{ vars.PAINEL_DOMINIO }}
          PAGES_PROJETO: ${{ vars.PAGES_PROJETO }}
        run: |
          set -euo pipefail
          origens=$(sed -n 's/^ALLOWED_ORIGIN = "\(.*\)"$/\1/p' wrangler.toml)
          origens="$origens,https://${PAGES_PROJETO:-painel-meteo}.pages.dev"
          dominio=$(printf '%s' "${PAINEL_DOMINIO:-}" | sed -E 's#^https?://##; s#/.*$##' | tr 'A-Z' 'a-z')
          if [ -n "$dominio" ]; then
            if ! printf '%s' "$dominio" | grep -Eq '^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$'; then
              echo "::error::PAINEL_DOMINIO inválido: $PAINEL_DOMINIO (use só o nome, ex.: tempo.seudominio.com.br)"; exit 1
            fi
            origens="$origens,https://$dominio"
          else
            echo "::notice::Variável PAINEL_DOMINIO vazia: o Worker aceita só o GitHub Pages e o endereço pages.dev."
          fi
          echo "Origens aceitas: $origens"
          npx --yes wrangler@4 deploy --var "ALLOWED_ORIGIN:$origens"

      - name: Conferir saúde
        if: steps.seg.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/saude.json -w '%{http_code}' "${{ steps.cf.outputs.url }}/v1/saude" || true)
            echo "tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/saude.json; echo; exit 0; fi
            sleep 10
          done
          echo "::warning::O Worker foi publicado, mas ainda não respondeu. O endereço workers.dev pode levar alguns minutos na primeira vez."

      # Resumo das medições de Campo Bom: quantas leituras horárias cada estação tem e os acumulados de chuva.
      # Só informativo (não falha o workflow); ajuda a ver se o histórico gravado pelo cron está completo.
      - name: Conferir medições
        if: steps.seg.outputs.ok == 'true'
        run: |
          curl -s -H "Origin: https://sidegum.github.io" "${{ steps.cf.outputs.url }}/v1/observacoes?lat=-29.68&lon=-51.05" -o /tmp/obs.json || true
          jq -c '.status' /tmp/obs.json || cat /tmp/obs.json
          jq -c '.fontes[] | select(.tipo == "inmet") | {id, modo, leituras26h: (.serie | length), primeira: (.serie[0].ms / 1000 | todate), ultima: (.serie[-1].ms / 1000 | todate), acumulados}' /tmp/obs.json || true

      - name: Apontar o app para o Worker
        if: steps.seg.outputs.ok == 'true'
        run: |
          git checkout -- worker/wrangler.toml
          node scripts/configurar.mjs "${{ steps.cf.outputs.url }}"
          if git diff --quiet -- js/config.js index.html; then echo "App já aponta para o Worker."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js index.html
          git commit -m "Aponta o app para o Worker publicado"
          git pull --rebase -q origin main
          git push
