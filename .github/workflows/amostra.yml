name: Amostra para o teste de tela
# Grava respostas reais das fontes (test/e2e/amostra.json.gz) para o teste de tela rodar sem rede.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [scripts/gravar-amostra.mjs, .github/workflows/amostra.yml]
permissions:
  contents: write
jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/gravar-amostra.mjs
      - name: Salvar no próprio branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/e2e/amostra.json.gz
          git commit -m "Grava amostra real das fontes para o teste de tela" || exit 0
          git push
