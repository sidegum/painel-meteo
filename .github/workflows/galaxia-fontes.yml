name: Fontes da escala de galáxias

# Baixa os catálogos brutos da escala de galáxias (scripts/globo/baixar-fontes-galaxia.sh) e grava em
# scripts/globo/fontes/ no branch em que rodou. Sob demanda ou quando o script muda: os catálogos são fixos.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/globo/baixar-fontes-galaxia.sh'
      - '.github/workflows/galaxia-fontes.yml'

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixar os catálogos
        run: scripts/globo/baixar-fontes-galaxia.sh scripts/globo/fontes
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/globo/fontes
          git commit -m "Catálogos brutos da escala de galáxias" || exit 0
          for espera in 0 10 30; do sleep $espera; git push && break; done
